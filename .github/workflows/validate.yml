name: Validate skill

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    uses: skill-publisher/dev-skills/.github/workflows/validate-skill.yml@main
    with:
      skill_name: lov-app-generator
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
